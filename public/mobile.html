<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kirby Retro — mobile</title>
  <meta name="description" content="Kirby Retro sur téléphone : ta bibliothèque rétro jouable au doigt dans le navigateur (NES, SNES, Game Boy, N64, DS…).">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#7ec8e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kirby Retro">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/favicon-192.png">
  <style>
    :root {
      --sky-top: #7ec8e8;
      --sky-mid: #b8dff0;
      --sky-bot: #eef8fd;
      --card: #ffffff;
      --text: #2a3a4a;
      --muted: #5a7080;
      --blue: #3a9fd8;
      --blue-deep: #2b7eb0;
      --blue-soft: #e3f2fa;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "Segoe UI", "Lucida Grande", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 280px, var(--sky-bot));
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    header.top {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
      background: linear-gradient(180deg, rgba(126, 200, 232, .97), rgba(126, 200, 232, .88));
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, .45);
    }
    .bar { display: flex; align-items: center; gap: 10px; }
    .logo { width: 38px; height: 38px; border-radius: 10px; box-shadow: 0 2px 6px rgba(42, 58, 74, .25); }
    .titles { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
    .titles strong { font-size: 1.05rem; }
    .titles small { color: #2b4a5e; font-size: .74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn {
      border: 0; border-radius: 999px; padding: .5rem .85rem; font: inherit; font-weight: 600;
      background: #fff; color: var(--blue-deep); box-shadow: 0 2px 6px rgba(42, 58, 74, .18);
      text-decoration: none; display: inline-flex; align-items: center; gap: .3rem;
    }
    .btn:active { transform: scale(.97); }
    .search {
      display: flex; align-items: center; gap: 8px; margin-top: 10px;
      background: #fff; border-radius: 999px; padding: .55rem .95rem;
      box-shadow: 0 2px 8px rgba(42, 58, 74, .15);
    }
    .search svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
    .search input { border: 0; outline: 0; font: inherit; flex: 1; min-width: 0; background: transparent; color: var(--text); }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; border: 0; border-radius: 999px; padding: .4rem .8rem; font: inherit; font-size: .84rem; font-weight: 600;
      background: rgba(255, 255, 255, .72); color: #2b4a5e; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .6);
      display: inline-flex; gap: .35rem; align-items: center;
    }
    .chip span { font-size: .7rem; opacity: .7; }
    .chip.active { background: var(--blue-deep); color: #fff; }
    .chip.active span { opacity: .85; }
    .hint {
      margin: 8px 2px 0; font-size: .78rem; color: #2b4a5e;
      background: rgba(255, 255, 255, .6); border-radius: 10px; padding: .45rem .6rem;
    }
    main { padding: 14px 12px calc(env(safe-area-inset-bottom, 0px) + 24px); }
    h2 { font-size: .98rem; margin: 0 0 8px; }
    .grid-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .grid-head h2 { margin: 0; }
    .count { color: var(--muted); font-size: .78rem; }
    .strip { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
    .strip::-webkit-scrollbar { display: none; }
    .strip .game { flex: 0 0 96px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 14px 10px; }
    .game { display: block; text-decoration: none; color: inherit; }
    .game .cover {
      position: relative; aspect-ratio: 1/1; border-radius: 14px; overflow: hidden;
      background: #fff; box-shadow: 0 3px 10px rgba(42, 58, 74, .2);
    }
    .game .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .game .cover.placeholder {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #cfe6f4, #9cc7e0);
      color: #31556b; font-weight: 800; font-size: 1.15rem; letter-spacing: .02em;
    }
    .game .region {
      position: absolute; top: 6px; left: 6px; z-index: 1;
      background: rgba(42, 58, 74, .74); color: #fff; font-size: .58rem; font-weight: 700;
      padding: .12rem .35rem; border-radius: 6px;
    }
    .game .name {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      margin-top: 6px; font-size: .78rem; font-weight: 600; line-height: 1.25;
    }
    .game .sub { display: block; color: var(--muted); font-size: .68rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .game:active .cover { box-shadow: 0 1px 4px rgba(42, 58, 74, .25); transform: translateY(1px); }
    .empty { color: var(--muted); text-align: center; margin: 32px 12px; }
    footer {
      padding: 0 14px calc(env(safe-area-inset-bottom, 0px) + 22px);
      color: #2b4a5e; font-size: .78rem; text-align: center;
    }
    footer a { color: var(--blue-deep); font-weight: 600; text-decoration: none; }
    footer p { margin: .55rem 0 0; }
    .section { margin-bottom: 16px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="bar">
      <img class="logo" src="/favicon-192.png" alt="">
      <div class="titles">
        <strong>Kirby Retro</strong>
        <small id="subtitle">Chargement de la bibliothèque…</small>
      </div>
      <button class="btn" id="install" type="button" hidden>⬇ Installer</button>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="q" type="search" placeholder="Rechercher un jeu…" autocomplete="off" spellcheck="false" aria-label="Rechercher un jeu">
    </label>
    <nav class="chips" id="chips" aria-label="Filtrer par console"></nav>
    <p class="hint" id="ios-hint" hidden>📲 Sur iPhone : bouton <strong>Partager</strong> → <strong>« Sur l’écran d’accueil »</strong> pour installer l’appli.</p>
  </header>

  <main>
    <section class="section" id="recent-sec" hidden>
      <h2>Récemment joués</h2>
      <div class="strip" id="recent"></div>
    </section>

    <section class="section">
      <div class="grid-head">
        <h2 id="grid-title">Tous les jeux</h2>
        <span class="count" id="count"></span>
      </div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>Aucun jeu ici pour l’instant.</p>
    </section>
  </main>

  <footer>
    <p>
      <a href="/">version bureau</a> ·
      <a href="/client.html">client PC</a> ·
      <a href="/licenses.html">licences</a> ·
      <a href="#" onclick="event.preventDefault();window.avertissementLegal&&window.avertissementLegal();">informations légales</a>
    </p>
    <p id="apk-line"><a id="apk-link" href="/downloads/kirby-retro-mobile-0.1.apk" download>⬇ Application Android (.apk)</a></p>
  </footer>

  <script>
    // Bibliothèque mobile : liste plate + recherche + filtres, lecture via /play.html.
    const RECENT_KEY = "retro-recent";
    const state = { library: null, games: [], system: "all", query: "" };

    const els = {
      subtitle: document.getElementById("subtitle"),
      chips: document.getElementById("chips"),
      q: document.getElementById("q"),
      grid: document.getElementById("grid"),
      gridTitle: document.getElementById("grid-title"),
      count: document.getElementById("count"),
      empty: document.getElementById("empty"),
      recentSec: document.getElementById("recent-sec"),
      recent: document.getElementById("recent"),
      install: document.getElementById("install"),
      iosHint: document.getElementById("ios-hint"),
    };

    const normalizeText = (value) => String(value || "")
      .toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/gu, "");
    const playUrl = (system, file) =>
      `/play.html?system=${encodeURIComponent(system)}&file=${encodeURIComponent(file)}`;
    const shortLabel = (label) => String(label || "").split(" / ")[0];

    function initials(game) {
      const words = String(game.label || game.system || "?").split(/[\s/]+/u).map((w) => w[0]).join("");
      return (words.slice(0, 3) || "?").toUpperCase();
    }

    function card(game, { small = false } = {}) {
      const link = document.createElement("a");
      link.className = "game";
      if (small) link.classList.add("small");
      link.href = playUrl(game.system, game.file);

      const cover = document.createElement("div");
      cover.className = "cover";
      if (game.cover) {
        const img = document.createElement("img");
        img.src = game.cover;
        img.alt = "";
        img.loading = "lazy";
        img.decoding = "async";
        img.addEventListener("error", () => {
          img.remove();
          cover.classList.add("placeholder");
          cover.textContent = initials(game);
        });
        cover.append(img);
      } else {
        cover.classList.add("placeholder");
        cover.textContent = initials(game);
      }
      if (game.region) {
        const badge = document.createElement("span");
        badge.className = "region";
        badge.textContent = game.region;
        cover.append(badge);
      }

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = game.title || game.file;

      link.append(cover, name);
      if (!small) {
        const sub = document.createElement("span");
        sub.className = "sub";
        sub.textContent = [shortLabel(game.label), game.year || null].filter(Boolean).join(" · ");
        link.append(sub);
      }
      return link;
    }

    function chips() {
      const systems = (state.library?.systems ?? []).filter((system) => system.count > 0);
      const total = systems.reduce((sum, system) => sum + system.count, 0);
      const items = [{ id: "all", label: "Tout", count: total }, ...systems];
      els.chips.replaceChildren(...items.map((item) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `chip${state.system === item.id ? " active" : ""}`;
        button.innerHTML = `${item.label}<span>${item.count}</span>`;
        button.addEventListener("click", () => {
          state.system = item.id;
          chips();
          render();
          window.scrollTo({ top: 0 });
        });
        return button;
      }));
    }

    function render() {
      if (!state.library) return;
      const query = normalizeText(state.query.trim());
      const label = (state.library.systems ?? []).find((s) => s.id === state.system)?.label;
      const list = state.games.filter((game) =>
        (state.system === "all" || game.system === state.system)
        && (!query
          || normalizeText(game.title).includes(query)
          || normalizeText(game.file).includes(query)
          || normalizeText(game.label).includes(query))
      );
      els.gridTitle.textContent = state.system === "all" ? "Tous les jeux" : (label || "Jeux");
      els.count.textContent = `${list.length} jeu${list.length > 1 ? "x" : ""}`;
      els.grid.replaceChildren(...list.map((game) => card(game)));
      els.empty.hidden = list.length > 0;
    }

    function renderRecent() {
      let recent = [];
      try { recent = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch { /* */ }
      if (!Array.isArray(recent) || !recent.length) return;
      const resolved = recent.filter((entry) => entry && entry.system && entry.file).slice(0, 12);
      if (!resolved.length) return;
      els.recentSec.hidden = false;
      els.recent.replaceChildren(...resolved.map((entry) => card({
        system: entry.system, file: entry.file, title: entry.title || entry.file, cover: entry.cover || null,
      }, { small: true })));
    }

    async function boot() {
      renderRecent();
      try {
        const response = await fetch("/api/library");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.library = await response.json();
      } catch (error) {
        els.subtitle.textContent = `Bibliothèque indisponible (${error.message})`;
        els.empty.hidden = false;
        els.empty.textContent = "Impossible de charger la bibliothèque — vérifie la connexion puis recharge la page.";
        return;
      }
      for (const system of state.library.systems ?? []) {
        for (const game of system.games) {
          state.games.push({ ...game, label: system.label, core: system.core });
        }
      }
      const systems = (state.library.systems ?? []).filter((s) => s.count > 0);
      els.subtitle.textContent = `${state.library.totalGames} jeux · ${systems.length} console${systems.length > 1 ? "s" : ""}`;
      chips();
      render();
    }

    els.q.addEventListener("input", (event) => {
      state.query = event.target.value;
      render();
    });

    // PWA : bouton « Installer » (Android/Chrome) + astuce iPhone.
    let installPrompt = null;
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
      els.install.hidden = false;
    });
    els.install.addEventListener("click", async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice.catch(() => {});
      installPrompt = null;
      els.install.hidden = true;
    });
    window.addEventListener("appinstalled", () => { els.install.hidden = true; });

    const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !standalone) els.iosHint.hidden = false;

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }

    boot();
  </script>
  <script src="/warning.js?v=1" defer></script>
</body>
</html>
